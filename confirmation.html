<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email vérifié</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFDF5;
      --surface: #ffffff;
      --border: #d6e4e0;
      --text: #1a2e29;
      --muted: #7a9990;
      --accent: #3d6b5e;
      --success: #2e7d5e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 2px 16px rgba(61,107,94,0.08);
    }

    .icon-circle {
      width: 56px;
      height: 56px;
      background: rgba(61,107,94,0.1);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.4s ease forwards;
    }

    .icon-circle svg { width: 28px; height: 28px; stroke: var(--success); }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .btn-ouvrir {
      display: none;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.25rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .btn-ouvrir.visible { display: block; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Email vérifié</h1>
    <p class="subtitle" id="subtitle">Votre adresse email a bien été confirmée. Vous pouvez maintenant retourner sur l'application.</p>
    <button class="btn-ouvrir" id="btnOuvrir">Ouvrir l'application</button>
  </div>

  <script>
    var DEEP_LINK = 'devisartisa://';
    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var subtitle = document.getElementById('subtitle');
    var btnOuvrir = document.getElementById('btnOuvrir');

    function ouvrirApp() {
      window.location.href = DEEP_LINK;
    }

    if (isMobile) {
      subtitle.textContent = "Votre adresse email a bien été confirmée. Redirection vers l'application...";
      btnOuvrir.classList.add('visible');
      btnOuvrir.addEventListener('click', ouvrirApp);

      // Tentative de redirection automatique.
      setTimeout(ouvrirApp, 600);

      // Si après quelques secondes on est toujours sur cette page (l'app n'a
      // pas pris le relais — app non installée, ou redirection auto bloquée),
      // on affiche un message adapté pour guider vers le bouton manuel.
      setTimeout(function () {
        subtitle.textContent = "Votre adresse email a bien été confirmée. Si l'application ne s'est pas ouverte automatiquement, appuyez sur le bouton ci-dessous.";
      }, 2500);
    }
  </script>

</body>
</html>
