<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bon cadeau DevisArtisa</title>
<!--
  Page de validation des bons, pour le vendeur au comptoir.
  À mettre en ligne à l'adresse https://protaistimothee.github.io/DevisArtisa/bon (ou changer BON_PAGE_URL
  côté serveur et dans l'app). Le QR du bon ouvre cette page avec ?t=<jeton>.
  Seule chose à remplir : l'URL de ton projet Supabase ci-dessous.
-->
<style>
  :root { --vert:#234840; --jaune:#e9b800; --fond:#FFFDF5; --gris:#6b6b6b; --rouge:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif; background:var(--fond); color:#1a1a1a; }
  header { background:var(--vert); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:10px; }
  header .logo { width:30px; height:30px; border-radius:8px; background:var(--jaune); color:var(--vert); font-weight:900; display:grid; place-items:center; }
  header .titre { font-weight:700; font-size:16px; }
  header .sous { font-size:12px; opacity:.8; }
  main { max-width:440px; margin:0 auto; padding:20px 16px 40px; }
  .carte { background:#fff; border:2px solid var(--vert); border-radius:18px; overflow:hidden; }
  .carte .haut { background:var(--vert); color:#fff; padding:18px 20px; }
  .carte .sur { color:var(--jaune); font-size:12px; font-weight:800; letter-spacing:2px; }
  .carte .montant { font-size:44px; font-weight:800; line-height:1.1; }
  .carte .chez { font-size:15px; opacity:.9; }
  .carte .bas { padding:16px 20px; }
  .ligne { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; font-size:14px; }
  .ligne:last-child { border-bottom:0; }
  .ligne span:first-child { color:var(--gris); }
  .ligne span:last-child { font-weight:600; text-align:right; }
  .num { font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:1px; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .badge.ok { background:#e3f1ea; color:var(--vert); }
  .badge.ko { background:#fbe9e7; color:var(--rouge); }
  form { margin-top:18px; display:grid; gap:12px; }
  label { font-size:13px; font-weight:600; color:#333; display:grid; gap:6px; }
  input[type=text], input[type=tel] { font-size:20px; padding:12px 14px; border:1.5px solid #d8d3c3; border-radius:12px; background:#fff; width:100%; }
  input:focus { outline:none; border-color:var(--vert); }
  .pin { letter-spacing:8px; text-align:center; font-weight:700; }
  .petit { font-size:12px; color:var(--gris); font-weight:400; }
  .case { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:400; }
  button { font-size:17px; font-weight:800; padding:15px; border:0; border-radius:14px; background:var(--jaune); color:var(--vert); cursor:pointer; }
  button:disabled { opacity:.5; }
  .erreur { background:#fbe9e7; color:var(--rouge); border-radius:12px; padding:12px 14px; font-size:14px; font-weight:600; }
  .succes { text-align:center; padding:28px 10px 8px; }
  .succes .rond { width:96px; height:96px; border-radius:50%; background:var(--vert); color:var(--jaune); font-size:56px; display:grid; place-items:center; margin:0 auto 14px; }
  .succes h1 { margin:0; font-size:26px; color:var(--vert); }
  .succes .gros { font-size:40px; font-weight:800; margin:6px 0; }
  .aide { font-size:13px; color:var(--gris); text-align:center; margin-top:18px; line-height:1.5; }
  .cache { display:none; }
</style>
</head>
<body>
<header>
  <div class="logo">D</div>
  <div><div class="titre">Bon cadeau DevisArtisa</div><div class="sous">Validation au comptoir</div></div>
</header>
<main id="app"></main>

<script>
  // URL de la fonction valider-bon (même projet Supabase que l'app)
  const FONCTION = 'https://osuxusqeumunbkiuyuyo.supabase.co/functions/v1/valider-bon';

  const params = new URLSearchParams(location.search);
  const jeton = params.get('t');
  const app = document.getElementById('app');
  let pinMemo = '';
  try { pinMemo = localStorage.getItem('da_pin') || ''; } catch (e) {}

  const MESSAGES = {
    introuvable: "Ce bon n'existe pas. Vérifiez le numéro.",
    pin: 'PIN du magasin incorrect.',
    bloque: 'Trop d’essais. Réessayez dans 15 minutes.',
    deja_utilise: 'Ce bon a déjà été utilisé.',
    expire: 'Ce bon est expiré.',
    annule: 'Ce bon a été annulé.',
    serveur: 'Problème de connexion. Réessayez.',
  };

  const dateCH = (iso) => new Date(iso).toLocaleDateString('fr-CH', { day: 'numeric', month: 'long', year: 'numeric' });
  const heureCH = (iso) => new Date(iso).toLocaleString('fr-CH', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  async function appel(corps) {
    try {
      const r = await fetch(FONCTION, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps) });
      return await r.json();
    } catch (e) { return { ok: false, erreur: 'serveur' }; }
  }

  function carte(b) {
    const statuts = {
      actif: '<span class="badge ok">Valable</span>',
      utilise: '<span class="badge ko">Déjà utilisé</span>',
      expire: '<span class="badge ko">Expiré</span>',
      annule: '<span class="badge ko">Annulé</span>',
    };
    return `
      <div class="carte">
        <div class="haut">
          <div class="sur">BON CADEAU</div>
          <div class="montant">${Number(b.montant).toFixed(0)} CHF</div>
          <div class="chez">chez ${esc(b.fournisseur)}</div>
        </div>
        <div class="bas">
          <div class="ligne"><span>Numéro</span><span class="num">${esc(b.numero)}</span></div>
          <div class="ligne"><span>Client</span><span>${esc(b.beneficiaire || '—')}</span></div>
          <div class="ligne"><span>Valable jusqu'au</span><span>${dateCH(b.expire_le)}</span></div>
          <div class="ligne"><span>Statut</span><span>${statuts[b.statut] || ''}</span></div>
          ${b.utilise_le ? `<div class="ligne"><span>Utilisé le</span><span>${heureCH(b.utilise_le)}</span></div>` : ''}
        </div>
      </div>`;
  }

  function vueSaisie(erreur) {
    app.innerHTML = `
      ${erreur ? `<div class="erreur">${erreur}</div>` : ''}
      <form id="f">
        <label>Numéro du bon
          <input type="text" name="numero" class="num" placeholder="DA-XXXX-XXXX-XXXX" autocapitalize="characters" required>
        </label>
        <label>PIN du magasin
          <input type="tel" name="pin" class="pin" inputmode="numeric" maxlength="6" value="${esc(pinMemo)}" required>
        </label>
        <button>Vérifier le bon</button>
      </form>
      <p class="aide">Scannez le QR code du client, ou tapez le numéro écrit sous le code.</p>`;
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const d = new FormData(e.target);
      const numero = d.get('numero').trim().toUpperCase();
      const pin = d.get('pin').trim();
      const res = await appel({ action: 'consulter', numero, pin });
      if (!res.ok) return vueSaisie(MESSAGES[res.erreur] || MESSAGES.serveur);
      vueBon(res, { numero, pin });
    };
  }

  function vueBon(b, ident, erreur) {
    const utilisable = b.statut === 'actif';
    app.innerHTML = `
      ${erreur ? `<div class="erreur" style="margin-bottom:14px">${erreur}</div>` : ''}
      ${carte(b)}
      ${utilisable ? `
      <form id="f">
        <label>PIN du magasin
          <input type="tel" name="pin" class="pin" inputmode="numeric" maxlength="6" value="${esc(ident.pin || pinMemo)}" required>
        </label>
        <label class="case"><input type="checkbox" name="memo" ${pinMemo ? 'checked' : ''}> Mémoriser le PIN sur cet appareil</label>
        <label>N° de ticket de caisse <span class="petit">(facultatif)</span>
          <input type="text" name="ref" placeholder="Ex. 004471">
        </label>
        <button id="go">Encaisser le bon de ${Number(b.montant).toFixed(0)} CHF</button>
      </form>
      <p class="aide">Déduisez ${Number(b.montant).toFixed(0)} CHF de l'achat. Le bon ne peut être utilisé qu'une fois.<br>DevisArtisa vous rembourse chaque bon encaissé à la fin du mois.</p>`
      : `<p class="aide">Ce bon ne peut plus être encaissé.</p>`}`;
    if (!utilisable) return;
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const d = new FormData(e.target);
      const pin = d.get('pin').trim();
      try { d.get('memo') ? localStorage.setItem('da_pin', pin) : localStorage.removeItem('da_pin'); } catch (err) {}
      document.getElementById('go').disabled = true;
      const res = await appel({ action: 'valider', jeton: ident.jeton, numero: ident.numero, pin, ref_caisse: d.get('ref') });
      if (!res.ok) {
        if (res.erreur === 'deja_utilise' || res.erreur === 'expire' || res.erreur === 'annule') {
          const maj = await appel({ action: 'consulter', jeton: ident.jeton, numero: ident.numero, pin });
          return vueBon(maj.ok ? maj : b, ident, MESSAGES[res.erreur]);
        }
        return vueBon(b, ident, MESSAGES[res.erreur] || MESSAGES.serveur);
      }
      vueSucces(res);
    };
  }

  function vueSucces(r) {
    app.innerHTML = `
      <div class="succes">
        <div class="rond">✓</div>
        <h1>Bon encaissé</h1>
        <div class="gros">− ${Number(r.montant).toFixed(0)} CHF</div>
        <div>à déduire de l'achat de <strong>${esc(r.beneficiaire || 'ce client')}</strong></div>
      </div>
      <div class="carte" style="margin-top:20px"><div class="bas">
        <div class="ligne"><span>Numéro</span><span class="num">${esc(r.numero)}</span></div>
        <div class="ligne"><span>Encaissé le</span><span>${heureCH(r.utilise_le)}</span></div>
        <div class="ligne"><span>Magasin</span><span>${esc(r.fournisseur)}</span></div>
      </div></div>
      <p class="aide">C'est enregistré, vous n'avez rien à noter.<br>Ce montant figurera sur votre relevé de fin de mois.</p>`;
  }

  (async () => {
    if (!jeton) return vueSaisie();
    app.innerHTML = '<p class="aide">Chargement du bon…</p>';
    const res = await appel({ action: 'consulter', jeton });
    if (!res.ok) return vueSaisie(MESSAGES[res.erreur] || MESSAGES.serveur);
    vueBon(res, { jeton });
  })();
</script>
</body>
</html>
