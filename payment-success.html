<div class="container" style="text-align:center">
  <div class="row align-items-center justify-content-center" style="min-height:60vh;">
    <div class="col col-md-6 text-center">

      <style>
        @keyframes checkIn {
          from { opacity: 0; transform: scale(0.5); }
          to { opacity: 1; transform: scale(1); }
        }
        .btn-gold:hover {
          transform: scale(1.05);
          transition: transform 0.2s ease;
        }
      </style>

      <div data-aos="fade-down" data-aos-delay="0">
        <text><br/><br/></text>
        <span style="font-size:64px; display:inline-block; animation:checkIn 0.5s ease forwards;">✅</span>
      </div>

      <div data-aos="fade-up" data-aos-delay="200">
        <p style="font-size:32px; font-weight:800; color:#3d6b5e; margin:24px 0 12px;">
          Paiement réussi !
        </p>
      </div>

      <div data-aos="fade-up" data-aos-delay="300" id="redirect-message">
        <p style="color:#3d6b5e; font-size:16px; line-height:1.6;">
          Ouverture de l'application...
        </p>
      </div>

      <div data-aos="fade-up" data-aos-delay="400" id="manual-link" style="display:none; margin-top:16px;">
        <a href="#" id="app-link" style="color:#3d6b5e; font-weight:600; text-decoration:underline;">
          Ouvrir manuellement
        </a>
      </div>

      <div data-aos="fade-up" data-aos-delay="500" style="margin-top:20px;">
        <p style="font-size:12px; color:#3d6b5e;">🛡️ Paiements sécurisés via Stripe</p>
      </div>

    </div>
  </div>
</div>

<script>
(function() {
  var ua = navigator.userAgent || navigator.vendor || window.opera;
  var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /android/i.test(ua);
  var isMobile = isIOS || isAndroid;

  var DEEP_LINK = "devisartisa://";
  var APP_STORE_URL = "https://apps.apple.com/app/id6805438296";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=tprotais.devisartisa"; // à remplacer

  var STORE_URL = isIOS ? APP_STORE_URL : (isAndroid ? PLAY_STORE_URL : null);

  if (isMobile) {
    document.getElementById("app-link").href = STORE_URL;
    document.getElementById("manual-link").style.display = "block";

    var fallbackTimer = setTimeout(function() {
      // Si on est toujours sur la page après ce délai, l'app n'a probablement pas ouvert
      window.location.href = STORE_URL;
    }, 2000);

    // Si l'app s'ouvre, la page passe en arrière-plan : on annule le fallback
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        clearTimeout(fallbackTimer);
      }
    });
    window.addEventListener("pagehide", function() {
      clearTimeout(fallbackTimer);
    });

    // Tentative d'ouverture directe de l'app
    window.location.href = DEEP_LINK;
  } else {
    document.getElementById("redirect-message").innerHTML =
      '<p style="color:#3d6b5e; font-size:16px; line-height:1.6;">Vous pouvez maintenant fermer la page.</p>';
  }
})();
</script>
