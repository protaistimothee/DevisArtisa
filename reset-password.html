<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFDF5;
      --surface: #ffffff;
      --border: #d6e4e0;
      --text: #1a2e29;
      --muted: #7a9990;
      --accent: #3d6b5e;
      --accent-hover: #2f5549;
      --error: #c0392b;
      --success: #2e7d5e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 2px 16px rgba(61,107,94,0.08);
    }

    .logo {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 10px;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg { width: 22px; height: 22px; fill: #fff; }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .input-wrap { position: relative; }

    input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.65rem 2.5rem 0.65rem 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus, input[type="text"]:focus { border-color: var(--accent); }

    .toggle-pw {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 0;
      display: flex;
    }

    .strength-bar {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 0.5rem;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s, background 0.3s;
    }

    .strength-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.3rem;
      min-height: 1rem;
    }

    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.75rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s, opacity 0.15s;
    }

    button[type="submit"]:hover:not(:disabled) { background: var(--accent-hover); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      display: none;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-top: 1rem;
      line-height: 1.5;
    }

    .message.error { background: rgba(192,57,43,0.07); color: var(--error); border: 1px solid rgba(192,57,43,0.2); }
    .message.success { background: rgba(61,107,94,0.08); color: var(--success); border: 1px solid rgba(61,107,94,0.25); }
    .message.show { display: block; }

    #view-invalid .back-link {
      display: inline-block;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--accent);
      text-decoration: none;
    }

    #view-invalid .back-link:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- Vue : formulaire -->
<div class="card" id="view-form">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
  </div>
  <h1>Nouveau mot de passe</h1>
  <p class="subtitle">Choisissez un mot de passe sécurisé pour votre compte.</p>

  <div class="field">
    <label for="password">Mot de passe</label>
    <div class="input-wrap">
      <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" oninput="checkStrength(this.value)" />
      <button type="button" class="toggle-pw" onclick="toggleVis('password', this)" aria-label="Afficher">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
    <div class="strength-label" id="strength-label"></div>
  </div>

  <div class="field">
    <label for="confirm">Confirmation</label>
    <div class="input-wrap">
      <input type="password" id="confirm" autocomplete="new-password" placeholder="••••••••" />
      <button type="button" class="toggle-pw" onclick="toggleVis('confirm', this)" aria-label="Afficher">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>

  <button type="submit" id="submit-btn" onclick="handleSubmit()">Mettre à jour</button>
  <div class="message error" id="msg-error"></div>
  <div class="message success" id="msg-success"></div>
</div>

<!-- Vue : lien invalide -->
<div class="card" id="view-invalid" style="display:none;">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
  </div>
  <h1>Lien expiré</h1>
  <p class="subtitle">Ce lien de réinitialisation est invalide ou a expiré. Vous pouvez en demander un nouveau depuis l'application.</p>
</div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────────────────────
  const SUPABASE_URL  = 'https://osuxusqeumunbkiuyuyo.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zdXh1c3FldW11bmJraXV5dXlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYwMDUsImV4cCI6MjA5NTEyMjAwNX0.SkbcWDy00RWaLhBybFvRAigdXZEP0S3ULvkHidhD-ZQ';
  // ─────────────────────────────────────────────────────────────────────────

  const params = Object.fromEntries(
    location.hash.slice(1).split('&').map(p => p.split('=').map(decodeURIComponent))
  );

  if (params.type !== 'recovery' || !params.access_token) {
    document.getElementById('view-form').style.display    = 'none';
    document.getElementById('view-invalid').style.display = 'block';
  }

  async function getSession() {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=recovery`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
      body: JSON.stringify({ access_token: params.access_token, refresh_token: params.refresh_token || '' })
    });
    return res.json();
  }

  async function handleSubmit() {
    const pw  = document.getElementById('password').value;
    const cfm = document.getElementById('confirm').value;
    const btn = document.getElementById('submit-btn');

    hideMsg();

    if (pw.length < 8)  return showError('Le mot de passe doit contenir au moins 8 caractères.');
    if (pw !== cfm)     return showError('Les mots de passe ne correspondent pas.');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Mise à jour…';

    try {
      const session = await getSession();
      if (session.error) throw new Error(session.error.message || 'Token invalide');

      const res = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON,
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ password: pw })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(data) || 'Erreur lors de la mise à jour');

      document.getElementById('msg-success').textContent = '✓ Mot de passe mis à jour. Vous pouvez fermer cette page.';
      document.getElementById('msg-success').classList.add('show');
      btn.style.display = 'none';
      history.replaceState(null, '', location.pathname);

    } catch (err) {
      showError(err.message);
      btn.disabled = false;
      btn.innerHTML = 'Mettre à jour';
    }
  }

  function showError(msg) {
    const el = document.getElementById('msg-error');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideMsg() {
    document.getElementById('msg-error').classList.remove('show');
    document.getElementById('msg-success').classList.remove('show');
  }

  function toggleVis(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  function checkStrength(pw) {
    const fill  = document.getElementById('strength-fill');
    const label = document.getElementById('strength-label');
    let score = 0;
    if (pw.length >= 8)           score++;
    if (/[A-Z]/.test(pw))         score++;
    if (/[0-9]/.test(pw))         score++;
    if (/[^A-Za-z0-9]/.test(pw))  score++;

    const levels = [
      { w: '0%',   color: 'transparent', text: '' },
      { w: '25%',  color: '#e07b6a',     text: 'Faible' },
      { w: '50%',  color: '#d4956a',     text: 'Moyen' },
      { w: '75%',  color: '#8aab6e',     text: 'Bon' },
      { w: '100%', color: '#3d6b5e',     text: 'Fort' },
    ];
    const lvl = levels[score];
    fill.style.width      = lvl.w;
    fill.style.background = lvl.color;
    label.textContent     = lvl.text;
    label.style.color     = lvl.color;
  }
</script>
</body>
</html>
