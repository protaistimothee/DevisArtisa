<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email vérifié</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FFFDF5;
      --surface: #ffffff;
      --border: #d6e4e0;
      --text: #1a2e29;
      --muted: #7a9990;
      --accent: #3d6b5e;
      --accent-hover: #2f5549;
      --success: #2e7d5e;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 2px 16px rgba(61,107,94,0.08);
    }

    .icon-circle {
      width: 56px;
      height: 56px;
      background: rgba(61,107,94,0.1);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.4s ease forwards;
    }

    .icon-circle svg { width: 28px; height: 28px; stroke: var(--success); }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.6); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    .btn {
      display: inline-block;
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.75rem;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Email vérifié</h1>
    <p class="subtitle">Votre adresse email a bien été confirmée. Vous pouvez maintenant retourner sur l'application.</p>
    <a href="#" class="btn">Retourner à l'application</a>
  </div>

</body>
</html>
