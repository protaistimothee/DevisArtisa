name: Sauvegarde quotidienne DevisArtisa

on:
  schedule:
    - cron: "0 2 * * *" # chaque nuit à 02:00 UTC (03:00 ou 04:00 en Suisse)
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Installer les outils (Supabase CLI, age, rclone)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Exporter la base (rôles, structure, données)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p export/base
          supabase db dump --db-url "$DB_URL" -f export/base/roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f export/base/schema.sql
          # Données, comptes utilisateurs (schéma auth) compris
          supabase db dump --db-url "$DB_URL" -f export/base/data.sql --use-copy --data-only

      - name: Copier les fichiers du Storage (PDF, photos, logos)
        env:
          RCLONE_CONFIG_SUPA_TYPE: s3
          RCLONE_CONFIG_SUPA_PROVIDER: Other
          RCLONE_CONFIG_SUPA_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          RCLONE_CONFIG_SUPA_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          RCLONE_CONFIG_SUPA_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          RCLONE_CONFIG_SUPA_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
        run: |
          mkdir -p export/storage
          rclone copy supa: export/storage --s3-force-path-style --transfers 8

      - name: Compresser et chiffrer
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          NOM="devisartisa-$(date -u +%Y-%m-%d).tar.gz.age"
          echo "NOM=$NOM" >> "$GITHUB_ENV"
          tar -czf - -C export . | age -r "$AGE_PUBLIC_KEY" -o "$NOM"
          ls -lh "$NOM"
          # Rien de lisible ne doit rester sur la machine
          rm -rf export

      - name: Envoyer sur kDrive (Infomaniak, Suisse)
        env:
          RCLONE_CONFIG_KDRIVE_TYPE: webdav
          RCLONE_CONFIG_KDRIVE_URL: ${{ secrets.KDRIVE_WEBDAV_URL }}
          RCLONE_CONFIG_KDRIVE_VENDOR: other
          RCLONE_CONFIG_KDRIVE_USER: ${{ secrets.KDRIVE_USER }}
          KDRIVE_APP_PASSWORD: ${{ secrets.KDRIVE_APP_PASSWORD }}
        run: |
          export RCLONE_CONFIG_KDRIVE_PASS="$(rclone obscure "$KDRIVE_APP_PASSWORD")"
          rclone copy "$NOM" kdrive:Sauvegardes-DevisArtisa/
          # Garde 30 jours d'historique
          rclone delete kdrive:Sauvegardes-DevisArtisa/ --min-age 30d
          rclone ls kdrive:Sauvegardes-DevisArtisa/ | tail -5
